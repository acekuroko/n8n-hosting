version: "3.8"
services:
  postgres:
    image: postgres:11
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
      - POSTGRES_NON_ROOT_USER
      - POSTGRES_NON_ROOT_PASSWORD
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      # --- Required Nginx Proxy / HTTPS Config ---
      - N8N_PROTOCOL=https
      - N8N_HOST=raspberrypi.local
      - WEBHOOK_URL=https://raspberrypi.local:8443/
      - N8N_EDITOR_BASE_URL=https://raspberrypi.local:8443/
    # Port 5678 is removed from host mapping because NPM will route traffic internally
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default # Keeps connection to postgres
      - npm_network # Allows NPM to reach this container

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB}
      - DB_POSTGRESDB_USER=${POSTGRES_USER}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - WEBHOOK_URL=https://raspberrypi.local:8443/
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - npm_network

volumes:
  postgres_data:

networks:
  npm_network:
    external: true
